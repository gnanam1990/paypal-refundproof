name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: determinism (second run)
        run: pnpm test:unit
      # Integration/restart/served suites start private PostgreSQL clusters with initdb/pg_ctl
      # (preinstalled on ubuntu runners under /usr/lib/postgresql/*/bin).
      - run: pnpm test:integration
      - run: pnpm test:restart
      - run: pnpm build
      - run: pnpm test:served
      - run: pnpm secret-scan
      - run: pnpm pack:check
